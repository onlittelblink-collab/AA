<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcadia Arcana — Tarot Shop Landing Page</title>

  <!-- Inter Tight Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      font-family: 'Inter Tight', sans-serif;
      background-color: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .exclusion-mode {
      mix-blend-mode: exclusion;
    }

    /* Cards are scaled every animation frame from JS; a very short linear
       transition smooths out the steps between frames without adding lag. */
    .bp-card {
      aspect-ratio: 2 / 3;
      will-change: transform;
      transition: transform 0.05s linear;
    }
    .bp-empty {
      aspect-ratio: 2 / 3;
    }

    /* Reliable full-screen height on mobile (avoids iOS Safari address-bar
       resize cutting off the hero). Falls back to 100vh when dvh isn't supported. */
    #main-canvas {
      height: 100vh;
      height: 100dvh;
    }
    @media (max-width: 1023px) {
      #main-canvas {
        top: 220px;
        height: calc(100vh - 220px);
        height: calc(100dvh - 220px);
      }
    }

    /* Social bars start off-screen to the right; JS slides them in with
       translateX driven by scroll (outro progress), matching the original's
       scroll-linked reveal timing. */
    .social-bar {
      transform: translateX(140%);
      transition: transform 0.05s linear;
      will-change: transform;
    }
    @media (prefers-reduced-motion: reduce) {
      .social-bar {
        transition: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bp-card {
        will-change: auto;
        transition: none;
      }
    }
  </style>
</head>
<body class="bg-black text-white select-none relative">

  <!-- 1B. Top Left Logo -->
  <div class="fixed z-20 top-4 left-4 lg:top-8 lg:left-8 w-[124px] sm:w-[266px] lg:w-[355px] exclusion-mode pointer-events-none">
    <svg viewBox="0 0 355 210" fill="none" class="w-full h-auto">
      <text x="0" y="80" fill="white" font-size="78" font-weight="700" letter-spacing="-0.05em" font-family="'Inter Tight', sans-serif">arcadia</text>
      <text x="0" y="180" fill="white" font-size="78" font-weight="700" letter-spacing="-0.05em" font-family="'Inter Tight', sans-serif">arcana</text>
    </svg>
  </div>

  <!-- 1C. Caption Text -->
  <div class="fixed z-20 left-4 lg:left-8 top-[153px] sm:top-[255px] lg:top-[344px] w-[calc(100vw-32px)] sm:w-[calc(50vw-48px)] lg:w-[692px] exclusion-mode pointer-events-none text-[12px] leading-[140%] tracking-[-0.04em] font-medium text-white">
    A tarot sanctuary where you feel truly recognized in your most authentic self.
  </div>

  <!-- 1D. Top Right Navigation -->
  <div class="fixed z-20 top-4 right-4 lg:top-8 lg:right-8 w-auto lg:w-[330px] h-[30px] flex items-center justify-between exclusion-mode pointer-events-none">
    <span class="hidden lg:block text-[15px] font-medium uppercase text-white tracking-tight">TAROT SHOP</span>
  </div>

  <!-- 1G. Fixed Hero Video (pinned background, hidden once scrolled past) -->
  <div id="main-canvas" class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <video id="hero-video" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-80">
      <source src="assets/hero-logo-3d.mp4" type="video/mp4">
    </video>
  </div>

  <!-- 1F. Social Links (slide in from the right during the outro scroll phase) -->
  <div id="social-links" class="fixed z-20 right-4 lg:right-8 bottom-24 lg:bottom-32 flex flex-col items-end gap-3">
    <a href="https://www.instagram.com/onitarot?igsh=MXdjczZyNmQ5djRiYw%3D%3D&utm_source=qr"
       target="_blank" rel="noopener noreferrer"
       class="social-bar pointer-events-auto flex items-center gap-3 bg-white text-black rounded-full px-5 py-3 lg:px-6 lg:py-4 shadow-2xl">
      <svg class="w-5 h-5 lg:w-6 lg:h-6 flex-shrink-0" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="black" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.2" stroke="black" stroke-width="1.8"/>
        <circle cx="17.4" cy="6.6" r="1.1" fill="black"/>
      </svg>
      <span class="text-[12px] lg:text-[13px] font-medium uppercase tracking-tight whitespace-nowrap">Direct on Instagram</span>
    </a>
    <a href="https://web.facebook.com/share/1M9KH1HfLE/?mibextid=wwXIfr&_rdc=1&_rdr"
       target="_blank" rel="noopener noreferrer"
       class="social-bar pointer-events-auto flex items-center gap-3 bg-white text-black rounded-full px-5 py-3 lg:px-6 lg:py-4 shadow-2xl">
      <svg class="w-5 h-5 lg:w-6 lg:h-6 flex-shrink-0" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10.5" stroke="black" stroke-width="1.8"/>
        <path d="M13.4 20V12.6H15.8L16.15 9.8H13.4V8.05C13.4 7.25 13.62 6.7 14.77 6.7H16.25V4.2C15.65 4.13 15.03 4.1 14.42 4.1C12.55 4.1 11.28 5.24 11.28 7.33V9.8H9.15V12.6H11.28V20H13.4Z" fill="black"/>
      </svg>
      <span class="text-[12px] lg:text-[13px] font-medium uppercase tracking-tight whitespace-nowrap">Direct on Facebook</span>
    </a>
  </div>

  <!-- 1I. White Outro Overlay (fades in near end of scroll) -->
  <div id="outro-overlay" class="fixed inset-0 pointer-events-none z-[12] bg-white" style="opacity:0"></div>

  <!-- 1J. Outro Footer (fades in near end of scroll) -->
  <div id="outro-footer" class="fixed pointer-events-none z-20 left-4 bottom-[24px] lg:left-4 lg:bottom-8 right-4 lg:right-auto flex items-center justify-between lg:gap-[80px] exclusion-mode" style="opacity:0">
    <span class="text-[11px] lg:text-[13px] font-medium tracking-tight text-white uppercase">ARCADIA ARCANA ® 2024</span>
  </div>

  <!-- SECTION 2: Black Panel Gallery (slides up to cover hero on scroll) -->
  <div id="black-panel" class="fixed inset-0 bg-black z-10 w-full h-full overflow-hidden" style="transform: translateY(100vh)">
    <div id="inner-wrapper" class="w-full" style="padding-top: min(400px, 40vh); padding-bottom: 8rem">
      <div id="gallery-grid" class="grid gap-4 md:gap-6 px-4 md:px-8 max-w-[1800px] mx-auto"></div>
    </div>
  </div>

  <script>
    // ---- Gallery assets (local, as replaced in the hero) ----
    var GALLERY_IMAGES = [
      'images/gallery-01.png', 'images/gallery-02.png', 'images/gallery-03.jpg',
      'images/gallery-04.png', 'images/gallery-05.png', 'images/gallery-06.png',
      'images/gallery-07.png', 'images/gallery-08.png', 'images/gallery-09.png',
      'images/gallery-10.png'
    ];

    // ---- Scattered layout generator (ported 1:1 from the original) ----
    function buildLayout(count, cols) {
      var rows = [];
      var imageIndex = 0;
      var r = 0;
      while (imageIndex < count) {
        var row = new Array(cols).fill(-1);
        var a = (r * 2 + (r % 2)) % cols;
        row[a] = imageIndex++;
        if (r % 3 === 0 && imageIndex < count) {
          var b = (a + 2) % cols;
          if (b === a) b = (a + 1) % cols;
          row[b] = imageIndex++;
        }
        rows.push(row);
        r++;
      }
      return rows;
    }

    // ---- Refs ----
    var mainCanvas = document.getElementById('main-canvas');
    var blackPanel = document.getElementById('black-panel');
    var innerWrapper = document.getElementById('inner-wrapper');
    var galleryGrid = document.getElementById('gallery-grid');
    var outroOverlay = document.getElementById('outro-overlay');
    var outroFooter = document.getElementById('outro-footer');
    var socialBars = Array.prototype.slice.call(document.querySelectorAll('.social-bar'));

    var cardEls = [];
    var cols = 4;
    var isDesktop = true;

    function getCols() {
      var w = window.innerWidth;
      if (w < 640) return 2;
      if (w < 1024) return 3;
      return 4;
    }

    // ---- Render gallery grid for current column count ----
    function renderGallery() {
      galleryGrid.innerHTML = '';
      galleryGrid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
      cardEls = new Array(GALLERY_IMAGES.length).fill(null);

      var rows = buildLayout(GALLERY_IMAGES.length, cols);
      rows.forEach(function (row) {
        row.forEach(function (cellValue, cIdx) {
          if (cellValue === -1) {
            var spacer = document.createElement('div');
            spacer.className = 'bp-empty w-full';
            galleryGrid.appendChild(spacer);
            return;
          }
          var isLeftHalf = cIdx < cols / 2;
          var card = document.createElement('div');
          card.className = 'bp-card w-full relative overflow-hidden rounded-sm bg-neutral-900 shadow-2xl';
          card.style.transformOrigin = isLeftHalf ? 'right bottom' : 'left bottom';
          card.style.transform = 'scale(0)';

          var img = document.createElement('img');
          img.src = GALLERY_IMAGES[cellValue];
          img.alt = 'Archive Piece ' + (cellValue + 1);
          img.loading = 'eager';
          img.className = 'w-full h-full object-cover pointer-events-none select-none';

          card.appendChild(img);
          galleryGrid.appendChild(card);
          cardEls[cellValue] = card;
        });
      });
    }

    // ---- Responsive setup ----
    function handleResize() {
      var w = window.innerWidth;
      var newIsDesktop = w >= 1024;
      var newCols = getCols();

      if (newIsDesktop !== isDesktop) {
        isDesktop = newIsDesktop;
      }
      if (newCols !== cols) {
        cols = newCols;
        renderGallery();
      }
    }

    cols = getCols();
    isDesktop = window.innerWidth >= 1024;
    renderGallery();
    window.addEventListener('resize', handleResize);

    // ---- Main animation loop: pin phases, card scaling, outro progress ----
    var spacerEl = document.body;
    var currentSpacerHeight = '';

    function updateLoop() {
      var vh = window.innerHeight;
      var vw = window.innerWidth;
      var scrollY = window.scrollY || window.pageYOffset;

      // 1. Hide the pinned hero video once scrolled past it
      mainCanvas.style.visibility = scrollY >= vh ? 'hidden' : 'visible';

      // 2. Compute total scrollable height so the fixed panel has room to move
      var wrapHeight = innerWrapper.offsetHeight;
      var maxScroll = Math.max(0, wrapHeight - vh);
      var totalHeight = (vh + maxScroll + 2 * vh) + 'px';
      if (totalHeight !== currentSpacerHeight) {
        currentSpacerHeight = totalHeight;
        document.documentElement.style.setProperty('--spacer-height', totalHeight);
        spacerHolder.style.height = totalHeight;
      }

      // 3. Phase 1: black panel slides up from bottom (0 -> vh scroll)
      if (scrollY <= vh) {
        blackPanel.style.transform = 'translateY(' + (vh - scrollY) + 'px)';
      } else {
        blackPanel.style.transform = 'translateY(0px)';
      }

      // 4. Phase 2: once panel is pinned, translate the gallery contents up
      if (scrollY > vh) {
        innerWrapper.style.transform = 'translateY(' + (-(scrollY - vh)) + 'px)';
      } else {
        innerWrapper.style.transform = 'translateY(0px)';
      }

      // 5. Scale each card based on its position in the viewport
      cardEls.forEach(function (card) {
        if (!card) return;
        var rect = card.getBoundingClientRect();
        var top = rect.top;
        var bottom = rect.bottom;

        if (bottom <= 0 || top >= vh) {
          card.style.transform = 'scale(0)';
        } else {
          var enter = Math.min(1, (vh - top) / (vh * 0.6));
          var exit = Math.min(1, bottom / (vh * 0.4));
          var scale = Math.max(0, Math.min(enter, exit));
          card.style.transform = 'scale(' + scale.toFixed(4) + ')';
        }
      });

      // 6. Outro progress: overlay fade, info lift, footer fade
      var outroStart = vh + maxScroll;
      var outroDistance = vh - 100;
      var outroProgress = 0;
      if (scrollY > outroStart) {
        outroProgress = Math.min(1, Math.max(0, (scrollY - outroStart) / outroDistance));
      }

      outroOverlay.style.opacity = outroProgress;
      outroFooter.style.opacity = outroProgress;

      socialBars.forEach(function (bar, i) {
        var barProgress = Math.min(1, Math.max(0, outroProgress * 1.3 - i * 0.15));
        bar.style.transform = 'translateX(' + (140 * (1 - barProgress)) + '%)';
      });
      requestAnimationFrame(updateLoop);
    }

    // Spacer element that actually gives the document its scrollable height
    var spacerHolder = document.createElement('div');
    spacerHolder.id = 'scroll-spacer';
    spacerHolder.style.height = '500vh';
    spacerHolder.style.width = '100%';
    document.body.appendChild(spacerHolder);

    requestAnimationFrame(updateLoop);
  </script>

</body>
</html>
